[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcore"
dynamic = ["version"]
description = "Medical imaging utilities based on SimpleITK"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "yongho choi", email = "yhchoi@hutom.co.kr" },
]
maintainers = [
    { name = "DATA", email = "dm@hutom.co.kr" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydicom>=3.0",
    "SimpleITK>=2.4",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "medcore._version.__version__" }

[tool.setuptools.packages.find]
include = ["medcore*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["test.ipynb"]

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F401", "F841"]

[tool.black]
line-length = 100
target-version = ["py311"]
