[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["test.ipynb"]

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F401", "F841"]

[tool.black]
line-length = 100
target-version = ["py311"]
